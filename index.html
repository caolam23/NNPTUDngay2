<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --bg-color: #f3f4f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #444;
        }

        /* Card Container Styling */
        .main-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            border: none;
            padding: 25px;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .page-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0;
        }

        /* Search Input Styling */
        .search-box .input-group-text {
            background-color: #fff;
            border-right: none;
            color: #aaa;
        }
        .search-box .form-control {
            border-left: none;
            box-shadow: none;
        }
        .search-box .form-control:focus {
            border-color: #dee2e6;
        }

        /* Table Styling */
        .custom-table {
            border-collapse: separate;
            border-spacing: 0 10px; /* Tạo khoảng cách giữa các dòng nếu muốn */
        }
        
        .custom-table thead th {
            border-bottom: 2px solid #e3e6f0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--secondary-color);
            padding: 15px;
            background: #fff;
        }

        .custom-table tbody tr {
            background-color: #fff;
            transition: all 0.2s;
        }

        .custom-table tbody tr:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .custom-table td {
            vertical-align: middle;
            padding: 15px;
            border-top: 1px solid #f2f2f2;
            font-size: 0.95rem;
        }

        /* Product Image */
        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Price & ID */
        .price-tag {
            color: #1cc88a;
            font-weight: 700;
        }
        .id-badge {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Custom Badges */
        .badge-soft-primary {
            color: #4e73df;
            background-color: rgba(78, 115, 223, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Sort Buttons */
        .btn-sort {
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="page-title"><i class="fas fa-box-open text-primary me-2"></i>Quản lý sản phẩm</h2>
                    <p class="text-muted mb-0 small">Quản lý kho hàng và giá cả</p>
                </div>
                
                <div class="col-md-5 col-12">
                    <div class="input-group search-box">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="form-control form-control-lg" 
                            placeholder="Tìm kiếm sản phẩm..." 
                            oninput="handleSearch()"
                        >
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <div class="btn-group shadow-sm" role="group">
                    <button class="btn btn-outline-secondary btn-sort" onclick="sortData('name', 'asc')">
                        <i class="fas fa-sort-alpha-down me-1"></i> Tên A-Z
                    </button>
                    <button class="btn btn-outline-secondary btn-sort" onclick="sortData('name', 'desc')">
                        <i class="fas fa-sort-alpha-up me-1"></i> Tên Z-A
                    </button>
                    <button class="btn btn-outline-secondary btn-sort" onclick="sortData('price', 'asc')">
                        <i class="fas fa-sort-amount-down-alt me-1"></i> Giá thấp
                    </button>
                    <button class="btn btn-outline-secondary btn-sort" onclick="sortData('price', 'desc')">
                        <i class="fas fa-sort-amount-up me-1"></i> Giá cao
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th scope="col" width="5%">#ID</th>
                            <th scope="col" width="10%">Ảnh</th>
                            <th scope="col" width="25%">Tên sản phẩm</th>
                            <th scope="col" width="15%">Danh mục</th>
                            <th scope="col" width="15%">Giá ($)</th>
                            <th scope="col">Mô tả</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        </tbody>
                </table>
            </div>
            
            <div id="no-result" class="text-center py-5 d-none">
                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                <p class="text-muted">Không tìm thấy sản phẩm nào.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
