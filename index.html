<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm & Bình luận Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --bg-color: #f3f4f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #444;
        }

        /* Card Container Styling */
        .main-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            border: none;
            padding: 25px;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .page-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0;
        }

        /* Search Input Styling */
        .search-box .input-group-text {
            background-color: #fff;
            border-right: none;
            color: #aaa;
        }
        .search-box .form-control {
            border-left: none;
            box-shadow: none;
        }
        .search-box .form-control:focus {
            border-color: #dee2e6;
        }

        /* Table Styling */
        .custom-table {
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        
        .custom-table thead th {
            border-bottom: 2px solid #e3e6f0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--secondary-color);
            padding: 15px;
            background: #fff;
        }

        .custom-table tbody tr {
            background-color: #fff;
            transition: all 0.2s;
        }

        .custom-table tbody tr:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .custom-table td {
            vertical-align: middle;
            padding: 15px;
            border-top: 1px solid #f2f2f2;
            font-size: 0.95rem;
        }

        /* Product Image */
        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Price & ID */
        .price-tag {
            color: var(--success-color);
            font-weight: 700;
        }
        .id-badge {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Custom Badges */
        .badge-soft-primary {
            color: #4e73df;
            background-color: rgba(78, 115, 223, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Sort Buttons */
        .btn-sort {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Section Separator */
        .section-header {
            border-bottom: 2px solid #f2f2f2;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3 section-header">
                <div>
                    <h2 class="page-title"><i class="fas fa-box-open text-primary me-2"></i>Quản lý sản phẩm</h2>
                    <p class="text-muted mb-0 small">Quản lý kho hàng, giá cả & trạng thái (Soft Delete)</p>
                </div>
                
                <div>
                    <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        <i class="fas fa-plus me-1"></i> Thêm mới
                    </button>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-6 col-12 mb-2 mb-md-0">
                    <div class="input-group search-box">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="form-control form-control-lg" 
                            placeholder="Tìm kiếm sản phẩm..." 
                            oninput="handleSearch()"
                        >
                    </div>
                </div>

                <div class="col-md-6 col-12 d-flex justify-content-md-end">
                    <div class="btn-group shadow-sm" role="group">
                        <button class="btn btn-outline-secondary btn-sort" onclick="sortData('name', 'asc')">
                            <i class="fas fa-sort-alpha-down me-1"></i> Tên A-Z
                        </button>
                        <button class="btn btn-outline-secondary btn-sort" onclick="sortData('name', 'desc')">
                            <i class="fas fa-sort-alpha-up me-1"></i> Tên Z-A
                        </button>
                        <button class="btn btn-outline-secondary btn-sort" onclick="sortData('price', 'asc')">
                            <i class="fas fa-sort-amount-down-alt me-1"></i> Giá thấp
                        </button>
                        <button class="btn btn-outline-secondary btn-sort" onclick="sortData('price', 'desc')">
                            <i class="fas fa-sort-amount-up me-1"></i> Giá cao
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th scope="col" width="5%">#ID</th>
                            <th scope="col" width="10%">Ảnh</th>
                            <th scope="col" width="20%">Tên sản phẩm</th>
                            <th scope="col" width="15%">Danh mục</th>
                            <th scope="col" width="10%">Giá ($)</th>
                            <th scope="col" width="10%">Trạng thái</th> <th scope="col" width="15%">Mô tả</th>
                            <th scope="col" width="15%" class="text-center">Hành động</th> </tr>
                    </thead>
                    <tbody id="product-list">
                        </tbody>
                </table>
            </div>
            
            <div id="no-result" class="text-center py-5 d-none">
                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                <p class="text-muted">Không tìm thấy sản phẩm nào.</p>
            </div>
        </div>

        <div class="main-card">
            <div class="section-header">
                <h2 class="page-title text-success"><i class="fas fa-comments me-2"></i>Quản lý Bình luận</h2>
                <p class="text-muted mb-0 small">Thêm, sửa, xóa bình luận (CRUD)</p>
            </div>

            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="bg-light p-3 rounded border">
                        <form id="commentForm" onsubmit="handleCommentSubmit(event)" class="row g-3 align-items-center">
                            <input type="hidden" id="commentId">
                            <div class="col-md-6">
                                <input type="text" id="commentBody" class="form-control" placeholder="Nhập nội dung bình luận..." required>
                            </div>
                            <div class="col-md-3">
                                <input type="number" id="commentPostId" class="form-control" placeholder="Post ID (VD: 160)" required>
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-success flex-grow-1"><i class="fas fa-paper-plane"></i> Lưu</button>
                                <button type="button" class="btn btn-secondary" onclick="resetCommentForm()"><i class="fas fa-times"></i> Hủy</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th scope="col" width="10%">ID</th>
                            <th scope="col" width="60%">Nội dung</th>
                            <th scope="col" width="15%">Post ID</th>
                            <th scope="col" width="15%" class="text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="comment-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Thêm Sản Phẩm Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm" onsubmit="createProduct(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên sản phẩm</label>
                            <input type="text" id="newTitle" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Giá ($)</label>
                            <input type="number" id="newPrice" class="form-control" placeholder="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Danh mục (Category ID)</label>
                            <input type="number" id="newCategoryId" class="form-control" value="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Link Ảnh</label>
                            <input type="text" id="newImage" class="form-control" placeholder="https://..." value="https://placehold.co/600x400">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Thêm mới (Auto ID)</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
